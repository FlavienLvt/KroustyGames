services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Preserve container's node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://127.0.0.1:5000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules # Preserve container's node_modules
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=your_user
      - DB_PASSWORD=your_password
      - DB_NAME=your_database
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15  # Use the correct version of PostgreSQL
    restart: always
    environment:
      POSTGRES_USER: your_user
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: your_database
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_user -d your_database"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data_v2:/var/lib/postgresql/data

volumes:
  db_data_v2: