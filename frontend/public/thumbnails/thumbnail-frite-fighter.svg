<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0d0e17"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2c1a"/>
      <stop offset="100%" stop-color="#261a0e"/>
    </linearGradient>
    <linearGradient id="friteuse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-nugget">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#1a1520"/>
    </radialGradient>
    <radialGradient id="nugget-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#e09010"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)"/>

  <!-- Counter surface -->
  <rect x="0" y="140" width="300" height="60" fill="url(#counter)"/>
  <rect x="0" y="137" width="300" height="5" fill="#5c3d1e"/>

  <!-- Friteuse (center bottom) -->
  <rect x="90" y="110" width="120" height="60" rx="8" fill="url(#friteuse)"/>
  <rect x="96" y="116" width="108" height="46" rx="6" fill="#555"/>
  <rect x="102" y="122" width="96" height="34" rx="4" fill="#1a1200" opacity="0.85"/>
  <!-- Oil bubble details -->
  <circle cx="130" cy="135" r="4" fill="#f5c020" opacity="0.7"/>
  <circle cx="150" cy="128" r="3" fill="#f5c020" opacity="0.6"/>
  <circle cx="165" cy="138" r="3.5" fill="#f5c020" opacity="0.65"/>
  <circle cx="180" cy="130" r="2.5" fill="#f5c020" opacity="0.5"/>
  <!-- Handle -->
  <rect x="207" y="124" width="18" height="7" rx="3.5" fill="#999"/>

  <!-- Holes grid (3 columns, 2 rows) -->
  <!-- Row 1 -->
  <ellipse cx="75"  cy="105" rx="22" ry="14" fill="url(#hole)"/>
  <ellipse cx="75"  cy="105" rx="22" ry="14" fill="none" stroke="#3a2a1a" stroke-width="3"/>
  <ellipse cx="150" cy="105" rx="22" ry="14" fill="url(#hole)"/>
  <ellipse cx="150" cy="105" rx="22" ry="14" fill="none" stroke="#3a2a1a" stroke-width="3"/>
  <ellipse cx="225" cy="105" rx="22" ry="14" fill="url(#hole)"/>
  <ellipse cx="225" cy="105" rx="22" ry="14" fill="none" stroke="#3a2a1a" stroke-width="3"/>

  <!-- Row 2 -->
  <ellipse cx="75"  cy="62" rx="22" ry="14" fill="url(#hole)"/>
  <ellipse cx="75"  cy="62" rx="22" ry="14" fill="none" stroke="#3a2a1a" stroke-width="3"/>
  <ellipse cx="150" cy="62" rx="22" ry="14" fill="url(#hole)"/>
  <ellipse cx="150" cy="62" rx="22" ry="14" fill="none" stroke="#3a2a1a" stroke-width="3"/>
  <ellipse cx="225" cy="62" rx="22" ry="14" fill="url(#hole)"/>
  <ellipse cx="225" cy="62" rx="22" ry="14" fill="none" stroke="#3a2a1a" stroke-width="3"/>

  <!-- Nugget popping up (left hole row 1) -->
  <ellipse cx="75" cy="96" rx="18" ry="15" fill="url(#nugget-glow)" filter="url(#glow-nugget)"/>
  <ellipse cx="69" cy="91" rx="5" ry="3.5" fill="#d49010" opacity="0.6"/>
  <ellipse cx="81" cy="89" rx="4" ry="3" fill="#d49010" opacity="0.5"/>
  <ellipse cx="82" cy="99" rx="4" ry="3" fill="#d49010" opacity="0.5"/>
  <!-- eye -->
  <circle cx="82" cy="93" r="3.5" fill="#fff"/>
  <circle cx="83" cy="93" r="2.5" fill="#1a1a1a"/>
  <circle cx="84" cy="92" r="1" fill="#fff"/>

  <!-- Frite popping up (right hole row 1) - trap -->
  <rect x="214" y="78" width="22" height="30" rx="3" fill="#f5b820" opacity="0.9"/>
  <rect x="218" y="74" width="14" height="10" rx="2" fill="#e5a010"/>
  <rect x="221" y="68" width="3" height="16" rx="1.5" fill="#f5c832"/>
  <rect x="228" y="70" width="3" height="14" rx="1.5" fill="#e5b020"/>
  <!-- X mark on frite -->
  <line x1="218" y1="88" x2="230" y2="100" stroke="#e63946" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="230" y1="88" x2="218" y2="100" stroke="#e63946" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Cursor / click indicator on middle-top nugget hole (empty, about to click) -->
  <circle cx="150" cy="62" r="20" fill="none" stroke="#ff9500" stroke-width="2" opacity="0.6" stroke-dasharray="4,3"/>
  <line x1="150" y1="36" x2="150" y2="44" stroke="#ff9500" stroke-width="2" opacity="0.6"/>
  <line x1="150" y1="80" x2="150" y2="88" stroke="#ff9500" stroke-width="2" opacity="0.6"/>
  <line x1="124" y1="62" x2="132" y2="62" stroke="#ff9500" stroke-width="2" opacity="0.6"/>
  <line x1="168" y1="62" x2="176" y2="62" stroke="#ff9500" stroke-width="2" opacity="0.6"/>

  <!-- Timer bar (top) -->
  <rect x="20" y="12" width="260" height="8" rx="4" fill="#232533"/>
  <rect x="20" y="12" width="170" height="8" rx="4" fill="#ff9500" opacity="0.9"/>
  <text x="150" y="11" font-family="Arial, sans-serif" font-size="9" fill="#ff9500" text-anchor="middle" opacity="0.8">TEMPS</text>

  <!-- Score -->
  <rect x="220" y="20" width="64" height="24" rx="6" fill="#232533"/>
  <text x="252" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#8c52ff" text-anchor="middle">32 pts</text>

  <!-- Bottom label -->
  <rect x="0" y="162" width="300" height="38" fill="#0d0e17" opacity="0.92"/>
  <rect x="0" y="162" width="300" height="1" fill="#2a2c3f"/>
  <text x="150" y="187" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ff9500" text-anchor="middle" letter-spacing="2">FRITE FIGHTER</text>
</svg>
