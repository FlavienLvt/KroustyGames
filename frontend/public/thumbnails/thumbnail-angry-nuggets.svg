<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfd4e8"/>
      <stop offset="60%" stop-color="#e8d5b0"/>
      <stop offset="100%" stop-color="#d4a870"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="100%" stop-color="#4a3208"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8922a"/>
      <stop offset="100%" stop-color="#8a5e10"/>
    </linearGradient>
    <linearGradient id="catapult-arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5e10"/>
      <stop offset="100%" stop-color="#c8922a"/>
    </linearGradient>
    <linearGradient id="nugget-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#d49010"/>
    </linearGradient>
    <filter id="glow-nugget">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="300" height="200" fill="url(#sky)"/>

  <!-- Clouds -->
  <ellipse cx="60"  cy="28" rx="32" ry="12" fill="#fff" opacity="0.55"/>
  <ellipse cx="82"  cy="23" rx="22" ry="10" fill="#fff" opacity="0.45"/>
  <ellipse cx="185" cy="35" rx="28" ry="10" fill="#fff" opacity="0.45"/>
  <ellipse cx="208" cy="30" rx="18" ry="8"  fill="#fff" opacity="0.4"/>

  <!-- Ground -->
  <rect x="0" y="140" width="300" height="60" fill="url(#ground)"/>
  <rect x="0" y="138" width="300" height="5" fill="#3d2c05"/>

  <!-- ===== CATAPULT (left side) ===== -->
  <!-- Wheel left -->
  <circle cx="48" cy="142" r="12" fill="#6b4c10" filter="url(#shadow)"/>
  <circle cx="48" cy="142" r="8"  fill="#8b6214"/>
  <line x1="48" y1="134" x2="48" y2="150" stroke="#5a3c08" stroke-width="2"/>
  <line x1="40" y1="142" x2="56" y2="142" stroke="#5a3c08" stroke-width="2"/>
  <!-- Wheel right -->
  <circle cx="78" cy="142" r="12" fill="#6b4c10" filter="url(#shadow)"/>
  <circle cx="78" cy="142" r="8"  fill="#8b6214"/>
  <line x1="78" y1="134" x2="78" y2="150" stroke="#5a3c08" stroke-width="2"/>
  <line x1="70" y1="142" x2="86" y2="142" stroke="#5a3c08" stroke-width="2"/>
  <!-- Base beam -->
  <rect x="36" y="130" width="56" height="14" rx="4" fill="url(#wood)"/>
  <!-- Pivot post -->
  <rect x="58"  y="100" width="10" height="34" rx="3" fill="url(#wood)"/>
  <!-- Arm (launched, angled up-left) -->
  <line x1="63" y1="112" x2="28" y2="68" stroke="#8b5e10" stroke-width="9" stroke-linecap="round"/>
  <line x1="63" y1="112" x2="90" y2="130" stroke="#8b5e10" stroke-width="9" stroke-linecap="round"/>
  <!-- Counterweight -->
  <circle cx="90" cy="130" r="10" fill="#5a3c08"/>
  <!-- Sling cup -->
  <circle cx="28" cy="68" r="8" fill="#6b4c10"/>

  <!-- ===== TRAJECTORY ARC ===== -->
  <path d="M 28 68 Q 130 10 230 75" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="7,5" opacity="0.65"/>

  <!-- ===== FLYING NUGGET ===== -->
  <g filter="url(#glow-nugget)">
    <ellipse cx="148" cy="40" rx="22" ry="17" fill="url(#nugget-body)"/>
    <!-- Breading texture -->
    <ellipse cx="140" cy="35" rx="6" ry="4" fill="#d49010" opacity="0.55"/>
    <ellipse cx="155" cy="33" rx="5" ry="3.5" fill="#d49010" opacity="0.5"/>
    <ellipse cx="158" cy="44" rx="5" ry="3.5" fill="#d49010" opacity="0.5"/>
    <!-- Angry eye -->
    <circle cx="157" cy="36" r="5" fill="#fff"/>
    <circle cx="159" cy="37" r="3.5" fill="#1a1a1a"/>
    <circle cx="160" cy="36" r="1.2" fill="#fff"/>
    <!-- Angry brow -->
    <line x1="152" y1="31" x2="162" y2="34" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
    <!-- Angry mouth -->
    <path d="M 148 46 Q 153 42 158 45" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Motion lines behind nugget -->
  <line x1="110" y1="44" x2="130" y2="40" stroke="#f97316" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="108" y1="52" x2="126" y2="47" stroke="#f97316" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>

  <!-- ===== STRUCTURE (right side) ===== -->
  <!-- Block tower - 3 columns of wooden crates -->
  <!-- Column 1 (tallest) -->
  <rect x="218" y="100" width="28" height="28" rx="3" fill="url(#wood)" filter="url(#shadow)"/>
  <line x1="218" y1="114" x2="246" y2="114" stroke="#5a3c08" stroke-width="1" opacity="0.6"/>
  <line x1="232" y1="100" x2="232" y2="128" stroke="#5a3c08" stroke-width="1" opacity="0.6"/>
  <rect x="218" y="128" width="28" height="12" rx="3" fill="#c8922a"/>
  <!-- Column 2 (medium) -->
  <rect x="248" y="110" width="26" height="28" rx="3" fill="url(#wood)" filter="url(#shadow)"/>
  <line x1="248" y1="124" x2="274" y2="124" stroke="#5a3c08" stroke-width="1" opacity="0.6"/>
  <rect x="248" y="128" width="26" height="12" rx="3" fill="#c8922a"/>
  <!-- Column 3 (short) -->
  <rect x="248" y="88" width="26" height="22" rx="3" fill="#d49010"/>
  <line x1="261" y1="88" x2="261" y2="110" stroke="#5a3c08" stroke-width="1" opacity="0.6"/>

  <!-- Enemy nugget on top of tower -->
  <ellipse cx="232" cy="93" rx="14" ry="11" fill="url(#nugget-body)"/>
  <circle  cx="237" cy="90" r="3.5" fill="#1a1a1a"/>
  <circle  cx="238" cy="89" r="1.2" fill="#fff"/>
  <!-- angry brow on enemy -->
  <line x1="233" y1="86" x2="240" y2="88" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Impact crack on structure (hit) -->
  <line x1="245" y1="108" x2="255" y2="118" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <line x1="250" y1="105" x2="256" y2="115" stroke="#fff" stroke-width="1" opacity="0.35"/>

  <!-- Score -->
  <rect x="16" y="10" width="68" height="22" rx="6" fill="#0d0e17" opacity="0.6"/>
  <text x="50" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f5c842" text-anchor="middle">⭐ 3</text>

  <!-- Bottom label -->
  <rect x="0" y="162" width="300" height="38" fill="#1a1004" opacity="0.92"/>
  <rect x="0" y="162" width="300" height="1" fill="#3d2c05"/>
  <text x="150" y="187" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f97316" text-anchor="middle" letter-spacing="2">ANGRY NUGGETS</text>
</svg>
