<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#2d6a9f"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f5c8"/>
      <stop offset="40%" stop-color="#c8e88a"/>
      <stop offset="100%" stop-color="#8ab840"/>
    </linearGradient>
    <linearGradient id="pipe-cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4ef90"/>
      <stop offset="100%" stop-color="#72a030"/>
    </linearGradient>
    <linearGradient id="nugget-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#e09010"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="300" height="200" fill="url(#sky)"/>

  <!-- Clouds -->
  <ellipse cx="50"  cy="40" rx="30" ry="12" fill="#fff" opacity="0.15"/>
  <ellipse cx="70"  cy="35" rx="20" ry="10" fill="#fff" opacity="0.12"/>
  <ellipse cx="220" cy="60" rx="35" ry="13" fill="#fff" opacity="0.12"/>
  <ellipse cx="245" cy="55" rx="22" ry="10" fill="#fff" opacity="0.1"/>

  <!-- Score display (top center) -->
  <rect x="125" y="10" width="50" height="26" rx="6" fill="#000" opacity="0.35"/>
  <text x="150" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>

  <!-- Top pipe -->
  <rect x="168" y="0" width="46" height="68" fill="url(#pipe)"/>
  <rect x="162" y="55" width="58" height="16" rx="4" fill="url(#pipe-cap)"/>

  <!-- Bottom pipe -->
  <rect x="168" y="116" width="46" height="84" fill="url(#pipe)"/>
  <rect x="162" y="116" width="58" height="16" rx="4" fill="url(#pipe-cap)"/>

  <!-- Gap line (center) -->
  <line x1="0" y1="100" x2="162" y2="100" stroke="#38bdf8" stroke-width="0.5" opacity="0.2" stroke-dasharray="6,6"/>

  <!-- Nugget (the bird) -->
  <ellipse cx="110" cy="95" rx="26" ry="22" fill="url(#nugget-body)" filter="url(#shadow)"/>
  <!-- Breading texture -->
  <ellipse cx="100" cy="88" rx="6" ry="4" fill="#e8b020" opacity="0.6"/>
  <ellipse cx="118" cy="84" rx="5" ry="3.5" fill="#e8b020" opacity="0.5"/>
  <ellipse cx="122" cy="98" rx="5" ry="4" fill="#e8b020" opacity="0.5"/>
  <ellipse cx="100" cy="103" rx="6" ry="4" fill="#e8b020" opacity="0.6"/>
  <!-- Eye -->
  <circle cx="124" cy="89" r="6" fill="#fff"/>
  <circle cx="126" cy="89" r="4" fill="#1a1a1a"/>
  <circle cx="127" cy="88" r="1.5" fill="#fff"/>
  <!-- Wing -->
  <ellipse cx="100" cy="103" rx="12" ry="7" fill="#d49010" opacity="0.8" transform="rotate(-20 100 103)"/>

  <!-- Ground -->
  <rect x="0" y="170" width="300" height="30" fill="#5a8a30"/>
  <rect x="0" y="166" width="300" height="6" fill="#3d6020"/>

  <!-- Bottom label -->
  <rect x="0" y="162" width="300" height="38" fill="#0d1520" opacity="0.88"/>
  <rect x="0" y="162" width="300" height="1" fill="#1a3050"/>
  <text x="150" y="187" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">FLAPPY NUGGET</text>
</svg>
