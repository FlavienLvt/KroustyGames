<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07080f"/>
      <stop offset="100%" stop-color="#12131f"/>
    </linearGradient>
    <linearGradient id="shooter-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#d49010"/>
    </linearGradient>
    <linearGradient id="bullet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-nugget">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-frite">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="300" height="200" fill="url(#space)"/>

  <!-- Stars -->
  <circle cx="20"  cy="15"  r="1"   fill="#fff" opacity="0.8"/>
  <circle cx="55"  cy="8"   r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="88"  cy="25"  r="1"   fill="#fff" opacity="0.7"/>
  <circle cx="130" cy="12"  r="1"   fill="#fff" opacity="0.8"/>
  <circle cx="180" cy="20"  r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="220" cy="8"   r="1"   fill="#fff" opacity="0.9"/>
  <circle cx="260" cy="18"  r="1"   fill="#fff" opacity="0.7"/>
  <circle cx="290" cy="30"  r="1"   fill="#fff" opacity="0.8"/>
  <circle cx="10"  cy="55"  r="1"   fill="#fff" opacity="0.5"/>
  <circle cx="270" cy="50"  r="1"   fill="#fff" opacity="0.7"/>
  <circle cx="40"  cy="135" r="1"   fill="#fff" opacity="0.4"/>
  <circle cx="280" cy="120" r="1"   fill="#fff" opacity="0.5"/>
  <circle cx="290" cy="155" r="1"   fill="#fff" opacity="0.6"/>

  <!-- Enemy grid: row 1 - frites (yellow, more HP) -->
  <!-- Frite shapes: tall rect -->
  <g filter="url(#glow-frite)" opacity="0.95">
    <rect x="28"  y="18" width="18" height="26" rx="3" fill="#f5c020"/>
    <rect x="31"  y="14" width="12" height="8"  rx="2" fill="#e5a800"/>
    <rect x="34"  y="8"  width="3"  height="11" rx="1.5" fill="#f5d040"/>
    <rect x="39"  y="10" width="3"  height="9"  rx="1.5" fill="#e8b820"/>

    <rect x="68"  y="18" width="18" height="26" rx="3" fill="#f5c020"/>
    <rect x="71"  y="14" width="12" height="8"  rx="2" fill="#e5a800"/>
    <rect x="74"  y="8"  width="3"  height="11" rx="1.5" fill="#f5d040"/>
    <rect x="79"  y="10" width="3"  height="9"  rx="1.5" fill="#e8b820"/>

    <rect x="108" y="18" width="18" height="26" rx="3" fill="#f5c020"/>
    <rect x="111" y="14" width="12" height="8"  rx="2" fill="#e5a800"/>
    <rect x="114" y="8"  width="3"  height="11" rx="1.5" fill="#f5d040"/>
    <rect x="119" y="10" width="3"  height="9"  rx="1.5" fill="#e8b820"/>

    <rect x="148" y="18" width="18" height="26" rx="3" fill="#f5c020"/>
    <rect x="151" y="14" width="12" height="8"  rx="2" fill="#e5a800"/>
    <rect x="154" y="8"  width="3"  height="11" rx="1.5" fill="#f5d040"/>
    <rect x="159" y="10" width="3"  height="9"  rx="1.5" fill="#e8b820"/>

    <rect x="188" y="18" width="18" height="26" rx="3" fill="#f5c020"/>
    <rect x="191" y="14" width="12" height="8"  rx="2" fill="#e5a800"/>
    <rect x="194" y="8"  width="3"  height="11" rx="1.5" fill="#f5d040"/>
    <rect x="199" y="10" width="3"  height="9"  rx="1.5" fill="#e8b820"/>

    <rect x="228" y="18" width="18" height="26" rx="3" fill="#f5c020"/>
    <rect x="231" y="14" width="12" height="8"  rx="2" fill="#e5a800"/>
    <rect x="234" y="8"  width="3"  height="11" rx="1.5" fill="#f5d040"/>
    <rect x="239" y="10" width="3"  height="9"  rx="1.5" fill="#e8b820"/>
  </g>

  <!-- Enemy grid: rows 2 & 3 - nuggets (oval shape) -->
  <g filter="url(#glow-nugget)" opacity="0.9">
    <!-- Row 2 -->
    <ellipse cx="37"  cy="72" rx="14" ry="11" fill="#f5c842"/>
    <circle  cx="42"  cy="69" r="3.5" fill="#1a1a1a"/>
    <circle  cx="43"  cy="68" r="1.2" fill="#fff"/>
    <ellipse cx="77"  cy="72" rx="14" ry="11" fill="#f5c842"/>
    <circle  cx="82"  cy="69" r="3.5" fill="#1a1a1a"/>
    <circle  cx="83"  cy="68" r="1.2" fill="#fff"/>
    <ellipse cx="117" cy="72" rx="14" ry="11" fill="#f5c842"/>
    <circle  cx="122" cy="69" r="3.5" fill="#1a1a1a"/>
    <circle  cx="123" cy="68" r="1.2" fill="#fff"/>
    <ellipse cx="157" cy="72" rx="14" ry="11" fill="#f5c842"/>
    <circle  cx="162" cy="69" r="3.5" fill="#1a1a1a"/>
    <circle  cx="163" cy="68" r="1.2" fill="#fff"/>
    <ellipse cx="197" cy="72" rx="14" ry="11" fill="#f5c842"/>
    <circle  cx="202" cy="69" r="3.5" fill="#1a1a1a"/>
    <circle  cx="203" cy="68" r="1.2" fill="#fff"/>
    <ellipse cx="237" cy="72" rx="14" ry="11" fill="#f5c842"/>
    <circle  cx="242" cy="69" r="3.5" fill="#1a1a1a"/>
    <circle  cx="243" cy="68" r="1.2" fill="#fff"/>

    <!-- Row 3 -->
    <ellipse cx="37"  cy="100" rx="14" ry="11" fill="#f5b020"/>
    <circle  cx="42"  cy="97"  r="3.5" fill="#1a1a1a"/>
    <circle  cx="43"  cy="96"  r="1.2" fill="#fff"/>
    <ellipse cx="77"  cy="100" rx="14" ry="11" fill="#f5b020"/>
    <circle  cx="82"  cy="97"  r="3.5" fill="#1a1a1a"/>
    <circle  cx="83"  cy="96"  r="1.2" fill="#fff"/>
    <ellipse cx="117" cy="100" rx="14" ry="11" fill="#f5b020"/>
    <circle  cx="122" cy="97"  r="3.5" fill="#1a1a1a"/>
    <circle  cx="123" cy="96"  r="1.2" fill="#fff"/>
    <!-- these ones are "dead" / hit -->
    <ellipse cx="157" cy="100" rx="14" ry="11" fill="#3a2810" opacity="0.5"/>
    <ellipse cx="197" cy="100" rx="14" ry="11" fill="#3a2810" opacity="0.5"/>
    <ellipse cx="237" cy="100" rx="14" ry="11" fill="#f5b020"/>
    <circle  cx="242" cy="97"  r="3.5" fill="#1a1a1a"/>
    <circle  cx="243" cy="96"  r="1.2" fill="#fff"/>
  </g>

  <!-- Shields (mid-field) -->
  <rect x="30"  cy="120" x="30"  y="118" width="38" height="12" rx="4" fill="#22c55e" opacity="0.5"/>
  <rect x="131" y="118" width="38" height="12" rx="4" fill="#22c55e" opacity="0.5"/>
  <rect x="232" y="118" width="38" height="12" rx="4" fill="#22c55e" opacity="0.5"/>
  <!-- damage on shields -->
  <rect x="40"  y="118" width="10" height="12" rx="2" fill="#07080f" opacity="0.6"/>
  <rect x="145" y="118" width="8"  height="12" rx="2" fill="#07080f" opacity="0.5"/>

  <!-- Ground line -->
  <rect x="0" y="155" width="300" height="3" fill="#2a2c3f"/>

  <!-- Player (chicken shooter at bottom) -->
  <ellipse cx="150" cy="148" rx="26" ry="14" fill="url(#shooter-body)"/>
  <ellipse cx="148" cy="140" rx="14" ry="10" fill="#f5c842"/>
  <!-- cannon -->
  <rect x="146" y="118" width="8" height="24" rx="4" fill="#d49010"/>
  <rect x="144" y="115" width="12" height="8" rx="4" fill="#e0a010"/>

  <!-- Ketchup bullet (travelling up) -->
  <ellipse cx="150" cy="95" rx="4" ry="9" fill="url(#bullet)" filter="url(#glow-red)"/>
  <ellipse cx="150" cy="105" rx="3" ry="5" fill="#ff9090" opacity="0.4"/>

  <!-- Enemy bullet (coming down) -->
  <ellipse cx="90" cy="132" rx="3" ry="7" fill="#84cc16" opacity="0.85"/>

  <!-- Bottom label -->
  <rect x="0" y="162" width="300" height="38" fill="#07080f" opacity="0.95"/>
  <rect x="0" y="162" width="300" height="1" fill="#1a1b2e"/>
  <text x="150" y="187" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e63946" text-anchor="middle" letter-spacing="2">KETCHUP DEFENDER</text>
</svg>
