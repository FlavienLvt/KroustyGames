<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <radialGradient id="arena" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#1e2035"/>
      <stop offset="100%" stop-color="#07080f"/>
    </radialGradient>
    <linearGradient id="player-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#d49010"/>
    </linearGradient>
    <linearGradient id="xp-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow-player">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-enemy">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-bullet">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="url(#arena)"/>

  <!-- Subtle grid floor -->
  <line x1="0" y1="40" x2="300" y2="40" stroke="#2a2c3f" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="80" x2="300" y2="80" stroke="#2a2c3f" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="120" x2="300" y2="120" stroke="#2a2c3f" stroke-width="0.5" opacity="0.5"/>
  <line x1="60" y1="0" x2="60" y2="160" stroke="#2a2c3f" stroke-width="0.5" opacity="0.5"/>
  <line x1="120" y1="0" x2="120" y2="160" stroke="#2a2c3f" stroke-width="0.5" opacity="0.5"/>
  <line x1="180" y1="0" x2="180" y2="160" stroke="#2a2c3f" stroke-width="0.5" opacity="0.5"/>
  <line x1="240" y1="0" x2="240" y2="160" stroke="#2a2c3f" stroke-width="0.5" opacity="0.5"/>

  <!-- Player aura / range circle -->
  <circle cx="150" cy="95" r="58" fill="none" stroke="#f97316" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="95" r="42" fill="none" stroke="#f97316" stroke-width="0.8" opacity="0.15"/>

  <!-- ENEMIES — friteuses around the player -->
  <!-- Top-left friteuse -->
  <g filter="url(#glow-enemy)" opacity="0.9">
    <rect x="28"  y="28"  width="34" height="26" rx="4" fill="#c8c8c8"/>
    <rect x="31"  y="31"  width="28" height="20" rx="3" fill="#666"/>
    <rect x="34"  y="34"  width="22" height="14" rx="2" fill="#1a1200" opacity="0.8"/>
    <circle cx="40" cy="41" r="2.5" fill="#f5c020" opacity="0.8"/>
    <circle cx="50" cy="38" r="2"   fill="#f5c020" opacity="0.7"/>
    <circle cx="56" cy="43" r="2"   fill="#f5c020" opacity="0.7"/>
  </g>
  <!-- Top-right friteuse -->
  <g filter="url(#glow-enemy)" opacity="0.9">
    <rect x="238" y="22"  width="34" height="26" rx="4" fill="#c8c8c8"/>
    <rect x="241" y="25"  width="28" height="20" rx="3" fill="#666"/>
    <rect x="244" y="28"  width="22" height="14" rx="2" fill="#1a1200" opacity="0.8"/>
    <circle cx="250" cy="35" r="2.5" fill="#f5c020" opacity="0.8"/>
    <circle cx="260" cy="32" r="2"   fill="#f5c020" opacity="0.7"/>
    <circle cx="266" cy="37" r="2"   fill="#f5c020" opacity="0.7"/>
  </g>
  <!-- Left friteuse -->
  <g filter="url(#glow-enemy)" opacity="0.85">
    <rect x="12"  y="80"  width="34" height="26" rx="4" fill="#c8c8c8"/>
    <rect x="15"  y="83"  width="28" height="20" rx="3" fill="#666"/>
    <rect x="18"  y="86"  width="22" height="14" rx="2" fill="#1a1200" opacity="0.8"/>
    <circle cx="24" cy="93" r="2.5" fill="#f5c020" opacity="0.8"/>
    <circle cx="34" cy="90" r="2"   fill="#f5c020" opacity="0.7"/>
  </g>
  <!-- Right friteuse -->
  <g filter="url(#glow-enemy)" opacity="0.85">
    <rect x="255" y="80"  width="34" height="26" rx="4" fill="#c8c8c8"/>
    <rect x="258" y="83"  width="28" height="20" rx="3" fill="#666"/>
    <rect x="261" y="86"  width="22" height="14" rx="2" fill="#1a1200" opacity="0.8"/>
    <circle cx="267" cy="93" r="2.5" fill="#f5c020" opacity="0.8"/>
    <circle cx="277" cy="90" r="2"   fill="#f5c020" opacity="0.7"/>
  </g>
  <!-- Bottom friteuse -->
  <g filter="url(#glow-enemy)" opacity="0.8">
    <rect x="133" y="132" width="34" height="26" rx="4" fill="#c8c8c8"/>
    <rect x="136" y="135" width="28" height="20" rx="3" fill="#666"/>
    <rect x="139" y="138" width="22" height="14" rx="2" fill="#1a1200" opacity="0.8"/>
    <circle cx="145" cy="145" r="2.5" fill="#f5c020" opacity="0.8"/>
    <circle cx="155" cy="142" r="2"   fill="#f5c020" opacity="0.7"/>
  </g>
  <!-- Bottom-left friteuse (partial) -->
  <g opacity="0.7">
    <rect x="40"  y="128" width="30" height="22" rx="4" fill="#c8c8c8"/>
    <rect x="43"  y="131" width="24" height="16" rx="3" fill="#666"/>
  </g>

  <!-- Bullets/projectiles flying outward -->
  <ellipse cx="105" cy="68" rx="3.5" ry="8" fill="#f97316" filter="url(#glow-bullet)" transform="rotate(-45 105 68)"/>
  <ellipse cx="195" cy="65" rx="3.5" ry="8" fill="#f97316" filter="url(#glow-bullet)" transform="rotate(45 195 65)"/>
  <ellipse cx="88"  cy="100" rx="3.5" ry="8" fill="#f97316" filter="url(#glow-bullet)"/>
  <ellipse cx="212" cy="100" rx="3.5" ry="8" fill="#f97316" filter="url(#glow-bullet)"/>

  <!-- Player (chicken, center) -->
  <g filter="url(#glow-player)">
    <!-- Glow ring -->
    <circle cx="150" cy="92" r="28" fill="#f97316" opacity="0.08"/>
    <!-- Body -->
    <ellipse cx="150" cy="97" rx="22" ry="16" fill="url(#player-body)"/>
    <!-- Head -->
    <circle cx="150" cy="78" r="16" fill="#f5c842"/>
    <!-- Eye -->
    <circle cx="156" cy="75" r="4" fill="#1a1a1a"/>
    <circle cx="157" cy="74" r="1.5" fill="#fff"/>
    <!-- Beak -->
    <polygon points="162,78 170,81 162,84" fill="#ff8c00"/>
    <!-- Crest -->
    <ellipse cx="148" cy="63" rx="5" ry="9" fill="#e63946" transform="rotate(-10 148 63)"/>
    <!-- Wing -->
    <ellipse cx="136" cy="94" rx="12" ry="8" fill="#d49010" opacity="0.8" transform="rotate(-20 136 94)"/>
  </g>

  <!-- HP bar -->
  <rect x="110" y="118" width="80" height="7" rx="3.5" fill="#2a2c3f"/>
  <rect x="110" y="118" width="55"  height="7" rx="3.5" fill="#e63946"/>

  <!-- Wave indicator -->
  <rect x="106" y="8" width="88" height="20" rx="5" fill="#1e2030"/>
  <text x="150" y="22" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle" letter-spacing="1">VAGUE 3</text>

  <!-- XP bar (top full width) -->
  <rect x="20" y="148" width="260" height="6" rx="3" fill="#232533"/>
  <rect x="20" y="148" width="180" height="6" rx="3" fill="url(#xp-bar)"/>
  <text x="150" y="145" font-family="Arial, sans-serif" font-size="8" fill="#fb923c" text-anchor="middle" opacity="0.7">XP</text>

  <!-- Bottom label -->
  <rect x="0" y="162" width="300" height="38" fill="#07080f"/>
  <rect x="0" y="162" width="300" height="1" fill="#2a2c3f"/>
  <text x="150" y="187" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f97316" text-anchor="middle" letter-spacing="2">KROUSTY SURVIVORS</text>
</svg>
