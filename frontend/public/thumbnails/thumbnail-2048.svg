<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0d0e17"/>
    </linearGradient>
    <linearGradient id="tile-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#e5a020"/>
    </linearGradient>
    <linearGradient id="tile-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f67c5f"/>
      <stop offset="100%" stop-color="#e85c3a"/>
    </linearGradient>
    <linearGradient id="tile-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4f4f"/>
      <stop offset="100%" stop-color="#cc2929"/>
    </linearGradient>
    <linearGradient id="tile-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <circle cx="30" cy="30" r="1.5" fill="#f97316" opacity="0.25"/>
  <circle cx="90" cy="30" r="1.5" fill="#f97316" opacity="0.25"/>
  <circle cx="210" cy="30" r="1.5" fill="#f97316" opacity="0.25"/>
  <circle cx="270" cy="30" r="1.5" fill="#f97316" opacity="0.25"/>
  <circle cx="30" cy="170" r="1.5" fill="#f97316" opacity="0.25"/>
  <circle cx="270" cy="170" r="1.5" fill="#f97316" opacity="0.25"/>

  <!-- Board background -->
  <rect x="52" y="18" width="196" height="148" rx="12" fill="#232533"/>

  <!-- Tile: 2048 (hero) -->
  <rect x="62" y="26" width="84" height="64" rx="8" fill="url(#tile-gold)" filter="url(#glow)"/>
  <text x="104" y="52" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="rgba(0,0,0,0.5)" text-anchor="middle">2048</text>
  <text x="104" y="70" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#fff8e8" text-anchor="middle">2048</text>

  <!-- Tile: 512 -->
  <rect x="154" y="26" width="84" height="64" rx="8" fill="url(#tile-orange)"/>
  <text x="196" y="65" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#fff" text-anchor="middle">512</text>

  <!-- Tile: 64 -->
  <rect x="62" y="98" width="84" height="60" rx="8" fill="url(#tile-red)"/>
  <text x="104" y="135" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">64</text>

  <!-- Tile: purple accent -->
  <rect x="154" y="98" width="84" height="60" rx="8" fill="url(#tile-amber)"/>
  <text x="196" y="135" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">32</text>

  <!-- Bottom label -->
  <rect x="0" y="160" width="300" height="40" fill="#0d0e17"/>
  <rect x="0" y="160" width="300" height="1" fill="#2a2c3f"/>
  <text x="150" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f97316" text-anchor="middle" letter-spacing="3">2048</text>
</svg>
